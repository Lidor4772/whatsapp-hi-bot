# Fly.io — free tier can run one small always-on VM with a volume for WhatsApp session.
# See DEPLOY.md for setup steps.

app = 'whatsapp-hi-bot'
primary_region = 'ams'

[build]

[env]
  AUTH_DATA_PATH = '/data/.wwebjs_auth'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = 'whatsapp_auth'
  destination = '/data'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
